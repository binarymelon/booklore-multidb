  # Virtual column: book_file.alt_format_current_hash (database-specific)
  - changeSet:
      id: baseline-book-file-virtual-column-mariadb
      author: booklore
      dbms: mariadb
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: book_file
                columnName: alt_format_current_hash
      changes:
        - sql:
            sql: >-
              ALTER TABLE book_file ADD COLUMN alt_format_current_hash VARCHAR(128)
              AS (CASE WHEN is_book = true THEN current_hash END) STORED

