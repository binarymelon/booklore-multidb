databaseChangeLog:

  # SQLite requires INTEGER (not BIGINT) for AUTOINCREMENT primary keys.
  # Use ${id.type} for all auto-increment PK columns.
  - property:
      name: id.type
      value: bigint
  - property:
      name: id.type
      value: integer
      dbms: sqlite

  # ============================================================
  # TIER 1 — Tables with no foreign key dependencies
  # ============================================================

  - changeSet:
      id: baseline-users
      author: booklore
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_default_password
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    unique: true
              - column:
                  name: provisioning_method
                  type: varchar(255)
              - column:
                  name: oidc_subject
                  type: varchar(255)
              - column:
                  name: oidc_issuer
                  type: varchar(512)
              - column:
                  name: avatar_url
                  type: varchar(1024)
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false

  - changeSet:
      id: baseline-library
      author: booklore
      preConditions:
