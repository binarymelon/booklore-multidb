databaseChangeLog:

  - changeSet:
      id: seed-cover-image-resolution
      author: booklore
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM app_settings WHERE name = 'cover_image_resolution'
      changes:
        - insert:
            tableName: app_settings
            columns:
              - column: { name: name, value: cover_image_resolution }
              - column: { name: val, value: '250x350' }

